[project]
name = "gym-coach-brain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.26.0,<4.0.0",
    "aiofiles>=23.0.0",
    "alembic>=1.18.4",
    "loguru>=0.7.3",
    "openai>=2.29.0",
    "pydantic[yaml]>=2.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.48",
    "torch>=2.10.0",
]

[project.scripts]
gym-coach-brain = "gym_coach_brain:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
