name: docs-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-files-exist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required docs
        run: |
          test -f README.md
          test -f docs/LLM_GUIDE.md
          test -f prompts/system.md
